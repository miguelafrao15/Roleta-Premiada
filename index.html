<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roleta Premiada</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 290px;
            aspect-ratio: 1;
            margin: 0 auto;
        }
        @media (min-width: 640px) {
            .wheel-wrapper {
                max-width: 360px;
            }
        }
        canvas#wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }
        .pointer {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 22px solid #3b82f6;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
    </style>
</head>
<body class="bg-zinc-50 dark:bg-black text-zinc-900 dark:text-zinc-100 min-h-screen flex flex-col justify-between p-4 overflow-x-hidden transition-colors duration-300">

    <!-- Header / Title & Theme Toggle -->
    <header class="w-full max-w-md mx-auto flex items-center justify-between py-3 mb-1 select-none">
        <div class="w-8"></div> <!-- Spacer -->
        <h1 id="page-title" class="text-lg sm:text-xl font-medium tracking-tight cursor-pointer hover:opacity-75 transition text-center">
            Roleta Premiada
        </h1>
        <button id="theme-toggle" class="w-8 h-8 rounded-full flex items-center justify-center bg-zinc-200/80 dark:bg-zinc-900 text-zinc-700 dark:text-zinc-300 transition">
            <i class="fa-solid fa-moon dark:hidden text-xs"></i>
            <i class="fa-solid fa-sun hidden dark:block text-xs"></i>
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center max-w-md w-full mx-auto gap-4">

        <!-- Navigation Tabs (Roleta / Fundos) -->
        <div class="flex bg-zinc-200/70 dark:bg-zinc-900 p-1 rounded-2xl w-full max-w-xs text-xs font-medium">
            <button id="tab-wheel-btn" class="flex-1 py-2 rounded-xl bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 shadow-sm transition">Roleta</button>
            <button id="tab-funds-btn" class="flex-1 py-2 rounded-xl text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition">Fundos</button>
        </div>

        <!-- Tab 1: Roleta View -->
        <div id="view-wheel" class="w-full flex flex-col items-center gap-4">
            <!-- Sync Badge -->
            <div id="sync-status" class="text-[11px] font-medium text-zinc-400 dark:text-zinc-600 flex items-center gap-1.5">
                <i class="fa-solid fa-circle-notch fa-spin text-amber-500"></i> Sincronizando
            </div>

            <!-- Timer Display (Estilo iOS) -->
            <div id="timer-box" class="hidden w-full bg-zinc-100 dark:bg-zinc-900/80 border border-zinc-200/80 dark:border-zinc-800/80 rounded-2xl p-3.5 text-center backdrop-blur-md">
                <div id="scheduled-time-label" class="text-[11px] font-medium text-zinc-500 dark:text-zinc-400 mb-0.5">
                    Giro Agendado (Brasília)
                </div>
                <div id="timer-countdown" class="text-2xl font-semibold tracking-tight text-zinc-900 dark:text-zinc-100">
                    00:00:00
                </div>
            </div>

            <!-- Wheel Canvas Area -->
            <div class="wheel-wrapper my-1">
                <div class="pointer"></div>
                <canvas id="wheel" width="600" height="600"></canvas>
            </div>

            <!-- Spin Button (Visível Apenas no Modo Desenvolvedor) -->
            <button id="spin-btn" class="hidden w-full max-w-xs bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-medium text-sm py-3 px-6 rounded-2xl shadow-md transition duration-200">
                GIRAR ROLETA
            </button>
        </div>

        <!-- Tab 2: Fundos & Top Doadores View -->
        <div id="view-funds" class="hidden w-full space-y-4">
            <!-- Total Funds Card -->
            <div class="bg-zinc-100 dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800/80 rounded-2xl p-5 text-center">
                <div class="text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1">Total em Fundos</div>
                <div id="total-funds-amount" class="text-3xl font-bold tracking-tight text-emerald-600 dark:text-emerald-400">R$ 0,00</div>
            </div>

            <!-- Top 3 Donors Card -->
            <div class="bg-zinc-100 dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800/80 rounded-2xl p-4 space-y-3">
                <div class="text-xs font-medium text-zinc-500 dark:text-zinc-400">Top 3 Doadores</div>
                <div id="top-donors-list" class="space-y-2">
                    <!-- Dynamic Top 3 -->
                </div>
            </div>
        </div>

        <!-- Developer Mode Panel (Estilo iOS Grouped List) -->
        <div id="dev-panel" class="hidden w-full bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-3xl p-5 shadow-2xl space-y-4 transition-all">
            <div class="flex justify-between items-center pb-2 border-b border-zinc-100 dark:border-zinc-800">
                <h2 class="text-xs font-semibold text-zinc-800 dark:text-zinc-200 uppercase tracking-wider">
                    Painel do Desenvolvedor
                </h2>
                <span class="text-[10px] font-semibold bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 px-2.5 py-0.5 rounded-full">Ativo</span>
            </div>

            <!-- Edit Wheel Title -->
            <div class="space-y-1">
                <label class="text-[11px] font-medium text-zinc-500 dark:text-zinc-400">Título da Roleta</label>
                <div class="flex gap-2">
                    <input type="text" id="dev-wheel-title" class="flex-1 bg-zinc-100 dark:bg-zinc-800 border-0 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                    <button id="save-title-btn" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-3.5 py-2 rounded-xl transition">Salvar</button>
                </div>
            </div>

            <!-- Timer Config -->
            <div class="space-y-1 pt-1 border-t border-zinc-100 dark:border-zinc-800">
                <label class="text-[11px] font-medium text-zinc-500 dark:text-zinc-400">Agendar Giro (Brasília)</label>
                <div class="flex gap-2">
                    <input type="time" id="dev-scheduled-time" step="1" class="bg-zinc-100 dark:bg-zinc-800 border-0 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-blue-500 outline-none text-zinc-800 dark:text-zinc-200">
                    <button id="enable-timer-btn" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-3 py-2 rounded-xl transition">Ativar</button>
                    <button id="disable-timer-btn" class="bg-zinc-200 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 text-xs font-medium px-3 py-2 rounded-xl transition">Desativar</button>
                </div>
            </div>

            <!-- Manage Funds & Donors (Dev) -->
            <div class="space-y-1.5 pt-1 border-t border-zinc-100 dark:border-zinc-800">
                <label class="text-[11px] font-medium text-zinc-500 dark:text-zinc-400">Adicionar / Editar Doação</label>
                <div class="flex gap-2">
                    <input type="text" id="dev-donor-name" placeholder="Nome do doador" class="flex-1 bg-zinc-100 dark:bg-zinc-800 border-0 rounded-xl px-3 py-2 text-xs outline-none">
                    <input type="number" id="dev-donor-amount" placeholder="Valor R$" class="w-24 bg-zinc-100 dark:bg-zinc-800 border-0 rounded-xl px-3 py-2 text-xs outline-none">
                    <button id="add-donor-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-3.5 py-2 rounded-xl transition">Add</button>
                </div>
            </div>

            <!-- Manage Items -->
            <div class="space-y-1.5 pt-1 border-t border-zinc-100 dark:border-zinc-800">
                <label class="text-[11px] font-medium text-zinc-500 dark:text-zinc-400">Novo Item na Roleta</label>
                <div class="flex gap-2">
                    <input type="text" id="dev-new-item" class="flex-1 bg-zinc-100 dark:bg-zinc-800 border-0 rounded-xl px-3 py-2 text-xs outline-none">
                    <button id="add-item-btn" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-3.5 py-2 rounded-xl transition">Adicionar</button>
                </div>
            </div>

            <!-- Items List -->
            <div class="space-y-1.5 pt-1 border-t border-zinc-100 dark:border-zinc-800">
                <label class="text-[11px] font-medium text-zinc-500 dark:text-zinc-400">Itens Cadastrados</label>
                <div id="items-list" class="space-y-1.5 max-h-36 overflow-y-auto pr-1">
                    <!-- Dynamic items -->
                </div>
            </div>
        </div>

    </main>

    <footer class="w-full text-center py-2"></footer>

    <!-- Result Modal (Estilo Popover iOS) -->
    <div id="result-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl space-y-4">
            <div class="text-[11px] font-medium text-zinc-400 uppercase tracking-wider">Resultado</div>
            <div id="winner-name" class="text-xl font-semibold text-zinc-900 dark:text-zinc-100 break-words"></div>
            <button id="close-modal-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl transition text-xs">OK</button>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-zinc-900 dark:bg-zinc-800 text-white text-xs px-4 py-2.5 rounded-full shadow-xl backdrop-blur transition-all duration-300 opacity-0 pointer-events-none z-50 whitespace-nowrap">
        <span id="toast-msg"></span>
    </div>

    <script>
        // CONFIGURAÇÕES DO GITHUB
        const GITHUB_TOKEN = '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';
        const REPO_OWNER = 'miguelafrao15';
        const REPO_NAME = 'Roleta-Premiada';
        const FILE_PATH = 'dados.txt';
        const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;

        // ESTADO DA APLICAÇÃO
        let appState = {
            title: "Roleta Premiada",
            items: [],
            scheduledTime: null,
            donors: [] // {name, amount}
        };
        let fileSha = null;

        // ESTADO DO MODO DEV (30 CLIQUES)
        let clickCount = 0;
        let clickTimer = null;
        let isDevMode = false;

        // ELEMENTOS DOM
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spin-btn');
        const pageTitle = document.getElementById('page-title');
        const devPanel = document.getElementById('dev-panel');
        const syncStatus = document.getElementById('sync-status');
        const itemsList = document.getElementById('items-list');
        const devWheelTitle = document.getElementById('dev-wheel-title');
        const saveTitleBtn = document.getElementById('save-title-btn');
        const devNewItem = document.getElementById('dev-new-item');
        const addItemBtn = document.getElementById('add-item-btn');
        const resultModal = document.getElementById('result-modal');
        const winnerName = document.getElementById('winner-name');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const themeToggle = document.getElementById('theme-toggle');

        // TABS
        const tabWheelBtn = document.getElementById('tab-wheel-btn');
        const tabFundsBtn = document.getElementById('tab-funds-btn');
        const viewWheel = document.getElementById('view-wheel');
        const viewFunds = document.getElementById('view-funds');

        // FUNDS DOM
        const totalFundsAmount = document.getElementById('total-funds-amount');
        const topDonorsList = document.getElementById('top-donors-list');
        const devDonorName = document.getElementById('dev-donor-name');
        const devDonorAmount = document.getElementById('dev-donor-amount');
        const addDonorBtn = document.getElementById('add-donor-btn');

        // TIMER DOM
        const timerBox = document.getElementById('timer-box');
        const timerCountdown = document.getElementById('timer-countdown');
        const scheduledTimeLabel = document.getElementById('scheduled-time-label');
        const devScheduledTime = document.getElementById('dev-scheduled-time');
        const enableTimerBtn = document.getElementById('enable-timer-btn');
        const disableTimerBtn = document.getElementById('disable-timer-btn');

        // ANIMATION STATE
        let currentAngle = 0;
        let isSpinning = false;
        let timerTriggeredToday = false;

        // CORES DAS FATIAS
        const colors = [
            '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', 
            '#ec4899', '#06b6d4', '#f43f5e', '#84cc16'
        ];

        // --- TABS SWITCHING ---
        tabWheelBtn.addEventListener('click', () => {
            tabWheelBtn.className = "flex-1 py-2 rounded-xl bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 shadow-sm transition";
            tabFundsBtn.className = "flex-1 py-2 rounded-xl text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition";
            viewWheel.classList.remove('hidden');
            viewFunds.classList.add('hidden');
            drawWheel();
        });

        tabFundsBtn.addEventListener('click', () => {
            tabFundsBtn.className = "flex-1 py-2 rounded-xl bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 shadow-sm transition";
            tabWheelBtn.className = "flex-1 py-2 rounded-xl text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition";
            viewFunds.classList.remove('hidden');
            viewWheel.classList.add('hidden');
            renderFundsView();
        });

        // --- DARK MODE TOGGLE ---
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            drawWheel();
        });

        // --- TOAST ---
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // --- HORÁRIO DE BRASÍLIA ---
        function getBrasiliaDate() {
            const now = new Date();
            const brasiliaStr = now.toLocaleString("en-US", { timeZone: "America/Sao_Paulo" });
            return new Date(brasiliaStr);
        }

        // --- TIMER ---
        function updateTimerLoop() {
            if (!appState.scheduledTime) {
                timerBox.classList.add('hidden');
                return;
            }

            timerBox.classList.remove('hidden');
            scheduledTimeLabel.innerText = `Giro Agendado (${appState.scheduledTime})`;

            const now = getBrasiliaDate();
            const [targetH, targetM, targetS = 0] = appState.scheduledTime.split(':').map(Number);

            const targetDate = new Date(now);
            targetDate.setHours(targetH, targetM, targetS, 0);

            let diff = targetDate.getTime() - now.getTime();

            if (diff < -5000) {
                targetDate.setDate(targetDate.getDate() + 1);
                diff = targetDate.getTime() - now.getTime();
                timerTriggeredToday = false;
            }

            if (Math.abs(diff) <= 1000 && !isSpinning && !timerTriggeredToday) {
                timerTriggeredToday = true;
                spinWheel();
            }

            if (diff > 0) {
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24).toString().padStart(2, '0');
                const minutes = Math.floor((diff / (1000 * 60)) % 60).toString().padStart(2, '0');
                const seconds = Math.floor((diff / 1000) % 60).toString().padStart(2, '0');
                timerCountdown.innerText = `${hours}:${minutes}:${seconds}`;
            } else {
                timerCountdown.innerText = "00:00:00";
            }
        }
        setInterval(updateTimerLoop, 1000);

        enableTimerBtn.addEventListener('click', () => {
            const val = devScheduledTime.value;
            if (val) {
                const formattedTime = val.length === 5 ? `${val}:00` : val;
                appState.scheduledTime = formattedTime;
                timerTriggeredToday = false;
                updateUI();
                saveToGitHub();
                showToast(`Timer agendado para ${formattedTime}`);
            }
        });

        disableTimerBtn.addEventListener('click', () => {
            appState.scheduledTime = null;
            updateUI();
            saveToGitHub();
            showToast('Timer desativado');
        });

        // --- GITHUB SYNC ---
        async function fetchFromGitHub() {
            try {
                syncStatus.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-amber-500"></i> Sincronizando`;
                const response = await fetch(API_URL, {
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (response.status === 404) {
                    appState = { title: "Roleta Premiada", items: [], scheduledTime: null, donors: [] };
                    fileSha = null;
                    updateUI();
                    syncStatus.innerHTML = `<i class="fa-solid fa-circle text-emerald-500 text-[8px]"></i> Sincronizado`;
                    return;
                }

                if (!response.ok) throw new Error();

                const data = await response.json();
                fileSha = data.sha;
                const content = decodeURIComponent(escape(atob(data.content)));
                
                try {
                    const parsed = JSON.parse(content);
                    appState.title = parsed.title || "Roleta Premiada";
                    appState.items = Array.isArray(parsed.items) ? parsed.items : [];
                    appState.scheduledTime = parsed.scheduledTime || null;
                    appState.donors = Array.isArray(parsed.donors) ? parsed.donors : [];
                } catch(e) {
                    const lines = content.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                    appState.title = "Roleta Premiada";
                    appState.items = lines;
                    appState.scheduledTime = null;
                    appState.donors = [];
                }

                updateUI();
                syncStatus.innerHTML = `<i class="fa-solid fa-circle text-emerald-500 text-[8px]"></i> Sincronizado`;
            } catch (error) {
                syncStatus.innerHTML = `<i class="fa-solid fa-circle text-red-500 text-[8px]"></i> Offline`;
            }
        }

        async function saveToGitHub() {
            try {
                syncStatus.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-amber-500"></i> Salvando`;
                
                const contentString = JSON.stringify(appState, null, 2);
                const base64Content = btoa(unescape(encodeURIComponent(contentString)));

                const bodyData = {
                    message: "Atualização de dados",
                    content: base64Content
                };

                if (fileSha) bodyData.sha = fileSha;

                const response = await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify(bodyData)
                });

                if (!response.ok) throw new Error();

                const data = await response.json();
                fileSha = data.content.sha;

                syncStatus.innerHTML = `<i class="fa-solid fa-circle text-emerald-500 text-[8px]"></i> Sincronizado`;
                showToast('Salvo com sucesso');
            } catch (error) {
                syncStatus.innerHTML = `<i class="fa-solid fa-circle text-red-500 text-[8px]"></i> Erro ao salvar`;
            }
        }

        // --- MODO DEV (30 CLIQUES NO TÍTULO) ---
        pageTitle.addEventListener('click', () => {
            clickCount++;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { clickCount = 0; }, 3000);

            if (clickCount >= 30) {
                clickCount = 0;
                isDevMode = !isDevMode;

                if (isDevMode) {
                    devPanel.classList.remove('hidden');
                    spinBtn.classList.remove('hidden');
                    devPanel.scrollIntoView({ behavior: 'smooth' });
                    showToast('Modo Desenvolvedor Ativo');
                } else {
                    devPanel.classList.add('hidden');
                    spinBtn.classList.add('hidden');
                    showToast('Modo Desenvolvedor Desativado');
                }
            }
        });

        // --- UI UPDATE ---
        function updateUI() {
            pageTitle.innerText = appState.title || "Roleta Premiada";
            devWheelTitle.value = appState.title || "";
            if (appState.scheduledTime) {
                devScheduledTime.value = appState.scheduledTime;
            }
            renderItemsList();
            renderFundsView();
            drawWheel();
            updateTimerLoop();
        }

        function renderFundsView() {
            // Calcular total
            const total = appState.donors.reduce((acc, curr) => acc + Number(curr.amount || 0), 0);
            totalFundsAmount.innerText = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            // Top 3 Ordenados
            const sorted = [...appState.donors].sort((a, b) => Number(b.amount) - Number(a.amount)).slice(0, 3);
            
            topDonorsList.innerHTML = '';
            if (sorted.length === 0) {
                topDonorsList.innerHTML = `<div class="text-xs text-zinc-400 italic py-1">Nenhum doador registrado</div>`;
                return;
            }

            sorted.forEach((donor, idx) => {
                const medals = ['🥇', '🥈', '🥉'];
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between bg-white dark:bg-zinc-800/80 px-3 py-2 rounded-xl text-xs';
                row.innerHTML = `
                    <div class="flex items-center gap-2 font-medium">
                        <span>${medals[idx]}</span>
                        <span>${escapeHtml(donor.name)}</span>
                    </div>
                    <span class="font-semibold text-emerald-600 dark:text-emerald-400">${Number(donor.amount).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</span>
                `;
                topDonorsList.appendChild(row);
            });
        }

        addDonorBtn.addEventListener('click', () => {
            const name = devDonorName.value.trim();
            const amount = parseFloat(devDonorAmount.value);
            if (name && !isNaN(amount)) {
                appState.donors.push({ name, amount });
                devDonorName.value = '';
                devDonorAmount.value = '';
                updateUI();
                saveToGitHub();
            }
        });

        function renderItemsList() {
            itemsList.innerHTML = '';
            if (appState.items.length === 0) {
                itemsList.innerHTML = `<div class="text-xs text-zinc-400 italic py-1">Nenhum item adicionado</div>`;
                return;
            }

            appState.items.forEach((item, index) => {
                const itemEl = document.createElement('div');
                itemEl.className = 'flex items-center gap-2 bg-zinc-100 dark:bg-zinc-800/80 px-3 py-1.5 rounded-xl';
                itemEl.innerHTML = `
                    <input type="text" value="${escapeHtml(item)}" data-index="${index}" class="edit-item-input flex-1 bg-transparent text-xs text-zinc-800 dark:text-zinc-200 focus:outline-none">
                    <button onclick="removeItem(${index})" class="text-zinc-400 hover:text-red-500 transition px-1"><i class="fa-solid fa-xmark text-sm"></i></button>
                `;
                itemsList.appendChild(itemEl);
            });

            document.querySelectorAll('.edit-item-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    const idx = e.target.getAttribute('data-index');
                    const val = e.target.value.trim();
                    if (val) {
                        appState.items[idx] = val;
                        drawWheel();
                        saveToGitHub();
                    }
                });
            });
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        addItemBtn.addEventListener('click', () => {
            const val = devNewItem.value.trim();
            if (val) {
                appState.items.push(val);
                devNewItem.value = '';
                updateUI();
                saveToGitHub();
            }
        });

        devNewItem.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addItemBtn.click();
        });

        window.removeItem = function(index) {
            appState.items.splice(index, 1);
            updateUI();
            saveToGitHub();
        };

        saveTitleBtn.addEventListener('click', () => {
            const val = devWheelTitle.value.trim();
            if (val) {
                appState.title = val;
                updateUI();
                saveToGitHub();
            }
        });

        // --- DESENHO DA ROLETA ---
        function drawWheel() {
            const numItems = appState.items.length;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 10;
            const isDark = document.documentElement.classList.contains('dark');

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (numItems === 0) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = isDark ? '#121212' : '#f4f4f5';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = isDark ? '#27272a' : '#e4e4e7';
                ctx.stroke();

                ctx.fillStyle = isDark ? '#71717a' : '#a1a1aa';
                ctx.font = '500 20px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Sem itens', centerX, centerY);
                return;
            }

            const sliceAngle = (2 * Math.PI) / numItems;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(currentAngle);

            for (let i = 0; i < numItems; i++) {
                const angle = i * sliceAngle;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, angle, angle + sliceAngle);
                ctx.closePath();

                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = isDark ? '#000000' : '#ffffff';
                ctx.stroke();

                ctx.save();
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                
                const fontSize = Math.max(14, Math.min(22, 280 / numItems));
                ctx.font = `600 ${fontSize}px -apple-system, sans-serif`;
                
                ctx.fillText(appState.items[i], radius - 22, 0);
                ctx.restore();
            }

            // Centro da roleta
            ctx.beginPath();
            ctx.arc(0, 0, 32, 0, 2 * Math.PI);
            ctx.fillStyle = isDark ? '#09090b' : '#ffffff';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = isDark ? '#27272a' : '#e4e4e7';
            ctx.stroke();

            ctx.restore();
        }

        // --- GIRAR ROLETA ---
        function spinWheel() {
            if (isSpinning) return;
            if (appState.items.length < 2) {
                showToast('Adicione pelo menos 2 itens');
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-50');

            const numItems = appState.items.length;
            const sliceAngle = (2 * Math.PI) / numItems;

            const winningIndex = Math.floor(Math.random() * numItems);
            const extraRotations = (5 + Math.floor(Math.random() * 4)) * 2 * Math.PI;

            const targetSliceCenter = winningIndex * sliceAngle + sliceAngle / 2;
            const finalAngle = extraRotations + (3 * Math.PI / 2) - targetSliceCenter;

            const startTime = performance.now();
            const duration = 5000;
            const startAngle = currentAngle % (2 * Math.PI);

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 4);

                currentAngle = startAngle + (finalAngle - startAngle) * easeOut;
                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    spinBtn.disabled = false;
                    spinBtn.classList.remove('opacity-50');
                    showWinner(appState.items[winningIndex]);
                }
            }

            requestAnimationFrame(animate);
        }

        spinBtn.addEventListener('click', spinWheel);

        // --- RESULTADO ---
        function showWinner(name) {
            winnerName.innerText = name;
            resultModal.classList.remove('hidden');

            confetti({
                particleCount: 90,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        closeModalBtn.addEventListener('click', () => {
            resultModal.classList.add('hidden');
        });

        // Sincronização periódica em background
        setInterval(() => {
            if (!isSpinning) {
                fetchFromGitHub();
            }
        }, 10000);

        // Inicialização
        window.onload = () => {
            fetchFromGitHub();
        };
    </script>
</body>
</html>
